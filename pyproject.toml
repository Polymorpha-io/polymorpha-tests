[project]
name = "polymorpha-tests"
version = "0.1.0"
description = "Central pytest shim — delegates to suites/business-logic/python"
requires-python = ">=3.10"
dependencies = [
  "polymorpha-stats @ git+https://github.com/Polymorpha-io/polymorpha-business-logic.git#subdirectory=python"
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[tool.pytest.ini_options]
testpaths = ["suites/business-logic/python/polymorpha/tests", "suites/cloud-functions"]
pythonpath = ["suites/business-logic/python"]
addopts = "-v --tb=short"
filterwarnings = [
  "ignore:invalid value encountered in divide",
  "ignore:Precision loss occurred in moment calculation"
]
